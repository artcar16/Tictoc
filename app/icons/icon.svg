<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Recto</title>
  <!-- Background: rounded square. scripts/make-icons.mjs turns it full-bleed for the maskable/Apple variants. -->
