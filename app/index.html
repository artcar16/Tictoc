<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recto</title>
    <meta name="description" content="Recto — flashcards simples pour réviser ses cours, hors ligne, sur le téléphone." />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Recto" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <main id="view" class="view">
        <!-- Static shell: replaced by the first screen as soon as the app starts. -->
        <div class="boot" aria-busy="true">
          <div class="boot-mark" aria-hidden="true"></div>
          <div class="boot-name">Recto</div>
        </div>
        <noscript>
          <p class="boot-noscript">Recto a besoin de JavaScript pour fonctionner.</p>
        </noscript>
      </main>

      <nav id="tabbar" class="tabbar" aria-label="Navigation principale">
        <a class="tab is-active" href="#/" data-tab="review" aria-current="page">
          <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M7 3.5h11a2 2 0 0 1 2 2V17"/></svg>
          <span>Réviser</span>
        </a>
        <a class="tab" href="#/cards" data-tab="cards">
          <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7l-2-3H5a2 2 0 0 0-2 2Z"/></svg>
          <span>Cartes</span>
        </a>
        <a class="tab" href="#/data" data-tab="data">
          <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.66 3.58 3 8 3s8-1.34 8-3v-13"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
          <span>Données</span>
        </a>
      </nav>
    </div>
  </body>
</html>
